<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e7a54">
<title>Menu Generator — Carnivore Daily</title>
<style>
:root{--ink:#1c2420;--muted:#65716a;--paper:#f8f8f3;--panel:#fff;--line:#e2e7de;--accent:#1e7a54;--accent-soft:#e5f3eb;--warm:#d18a3b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(900px,calc(100% - 28px));margin:auto;padding:28px 0 50px}header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px}
h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.04em}.muted{color:var(--muted)}a{color:var(--accent);font-weight:700;text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
label{display:grid;gap:5px;color:var(--muted);font-size:.82rem;font-weight:650}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font:inherit}
button{border:0;cursor:pointer;border-radius:10px;background:var(--accent);color:white;font:inherit;font-weight:750;padding:11px 15px}.secondary{background:#edf0ea;color:var(--ink)}
.result{margin-top:14px}.tag{display:inline-flex;border-radius:999px;padding:5px 9px;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:750;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.metric{background:#f3f5f1;border-radius:12px;padding:11px;text-align:center}.metric strong{display:block;font-size:1.2rem}.metric small{color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap}.note{font-size:.78rem;color:var(--muted);margin-top:10px}.count{font-size:.85rem;color:var(--muted);margin-top:8px}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<header><div><h1>Makan Apa Hari Ini?</h1><p class="muted">Carnivore, low-carb, sampai lauk warteg.</p></div><a href="index.html">← Daily Tracker</a></header>
<section class="card">
<div class="controls">
<label>Mode<select id="mode"><option>Semua</option><option>Carnivore</option><option>Low Carb</option><option>Regular</option></select></label>
<label>Kategori<select id="category"><option>Semua</option><option>Ayam</option><option>Sapi</option><option>Ikan</option><option>Telur</option><option>Jeroan</option><option>Tempe/Tahu</option><option>Lauk Warteg</option><option>Sayur</option></select></label>
<label>Porsi<input id="grams" type="number" min="50" max="1000" step="25" value="150"></label>
</div>
<div class="actions"><button id="roll">🎲 Acak Menu</button><button class="secondary" id="again">Acak Lagi</button></div>
<p class="count" id="count"></p>
</section>
<section class="card result" id="result">
<p class="muted">Klik “Acak Menu” untuk mulai.</p>
</section>
</main>
<script>
const MENUS=[{"name":"Ayam Bakar","mode":"Carnivore","cat":"Ayam","cal":215,"p":27,"f":11,"c":1,"note":"Estimasi per 100 g"},{"name":"Ayam Goreng","mode":"Low Carb","cat":"Ayam","cal":260,"p":24,"f":17,"c":4,"note":"Estimasi per 100 g"},{"name":"Ayam Air Fryer","mode":"Carnivore","cat":"Ayam","cal":220,"p":27,"f":12,"c":0,"note":"Estimasi per 100 g"},{"name":"Sate Ayam Polos","mode":"Carnivore","cat":"Ayam","cal":210,"p":28,"f":10,"c":1,"note":"Tanpa saus kacang/kecap"},{"name":"Ayam Butter","mode":"Low Carb","cat":"Ayam","cal":245,"p":25,"f":16,"c":1,"note":"Estimasi per 100 g"},{"name":"Ayam Balado","mode":"Regular","cat":"Ayam","cal":220,"p":24,"f":12,"c":6,"note":"Estimasi warteg per 100 g"},{"name":"Ayam Kecap","mode":"Regular","cat":"Ayam","cal":210,"p":22,"f":10,"c":10,"note":"Estimasi warteg per 100 g"},{"name":"Ayam Opor","mode":"Regular","cat":"Ayam","cal":215,"p":20,"f":14,"c":6,"note":"Estimasi warteg per 100 g"},{"name":"Ayam Gulai","mode":"Regular","cat":"Ayam","cal":225,"p":20,"f":15,"c":7,"note":"Estimasi warteg per 100 g"},{"name":"Steak Sapi","mode":"Carnivore","cat":"Sapi","cal":250,"p":26,"f":17,"c":0,"note":"Estimasi per 100 g"},{"name":"Beef Patty","mode":"Carnivore","cat":"Sapi","cal":255,"p":26,"f":17,"c":0,"note":"Tanpa bun"},{"name":"Sate Sapi Polos","mode":"Carnivore","cat":"Sapi","cal":235,"p":27,"f":14,"c":0,"note":"Estimasi per 100 g"},{"name":"Rendang Sapi","mode":"Regular","cat":"Sapi","cal":280,"p":23,"f":20,"c":6,"note":"Estimasi warteg per 100 g"},{"name":"Semur Daging","mode":"Regular","cat":"Sapi","cal":220,"p":20,"f":12,"c":12,"note":"Estimasi warteg per 100 g"},{"name":"Daging Balado","mode":"Regular","cat":"Sapi","cal":245,"p":23,"f":16,"c":5,"note":"Estimasi warteg per 100 g"},{"name":"Kembung Bakar","mode":"Carnivore","cat":"Ikan","cal":170,"p":22,"f":9,"c":0,"note":"Estimasi per 100 g"},{"name":"Tongkol Panggang","mode":"Carnivore","cat":"Ikan","cal":160,"p":27,"f":5,"c":0,"note":"Estimasi per 100 g"},{"name":"Tuna Steak","mode":"Carnivore","cat":"Ikan","cal":170,"p":29,"f":6,"c":0,"note":"Estimasi per 100 g"},{"name":"Bandeng Bakar","mode":"Carnivore","cat":"Ikan","cal":190,"p":21,"f":11,"c":0,"note":"Estimasi per 100 g"},{"name":"Tongkol Balado","mode":"Regular","cat":"Ikan","cal":180,"p":23,"f":9,"c":4,"note":"Estimasi warteg per 100 g"},{"name":"Kembung Balado","mode":"Regular","cat":"Ikan","cal":205,"p":22,"f":12,"c":4,"note":"Estimasi warteg per 100 g"},{"name":"Lele Goreng Warteg","mode":"Regular","cat":"Ikan","cal":240,"p":19,"f":17,"c":3,"note":"Estimasi warteg per 100 g"},{"name":"Bandeng Goreng Warteg","mode":"Regular","cat":"Ikan","cal":230,"p":22,"f":15,"c":4,"note":"Estimasi warteg per 100 g"},{"name":"Teri Goreng","mode":"Low Carb","cat":"Ikan","cal":290,"p":33,"f":15,"c":6,"note":"Estimasi per 100 g"},{"name":"Teri Kacang","mode":"Regular","cat":"Ikan","cal":360,"p":25,"f":24,"c":15,"note":"Estimasi warteg per 100 g"},{"name":"Telur Ceplok","mode":"Carnivore","cat":"Telur","cal":200,"p":13,"f":16,"c":1,"note":"Estimasi per 100 g"},{"name":"Telur Dadar","mode":"Carnivore","cat":"Telur","cal":205,"p":13,"f":16,"c":2,"note":"Estimasi per 100 g"},{"name":"Scrambled Egg Butter","mode":"Low Carb","cat":"Telur","cal":225,"p":13,"f":19,"c":2,"note":"Estimasi per 100 g"},{"name":"Telur Balado","mode":"Regular","cat":"Telur","cal":190,"p":12,"f":14,"c":5,"note":"Estimasi warteg per 100 g"},{"name":"Telur Dadar Padang","mode":"Regular","cat":"Telur","cal":250,"p":13,"f":20,"c":6,"note":"Estimasi warteg per 100 g"},{"name":"Hati Ayam Goreng","mode":"Carnivore","cat":"Jeroan","cal":170,"p":24,"f":7,"c":1,"note":"Estimasi per 100 g"},{"name":"Ampela Ayam","mode":"Carnivore","cat":"Jeroan","cal":155,"p":27,"f":4,"c":1,"note":"Estimasi per 100 g"},{"name":"Kikil Balado","mode":"Regular","cat":"Jeroan","cal":155,"p":18,"f":8,"c":4,"note":"Estimasi warteg per 100 g"},{"name":"Kikil Cabe Ijo","mode":"Regular","cat":"Jeroan","cal":150,"p":18,"f":8,"c":3,"note":"Estimasi warteg per 100 g"},{"name":"Babat Goreng","mode":"Low Carb","cat":"Jeroan","cal":180,"p":18,"f":11,"c":2,"note":"Estimasi per 100 g"},{"name":"Tempe Orek","mode":"Regular","cat":"Tempe/Tahu","cal":220,"p":12,"f":12,"c":18,"note":"Estimasi warteg per 100 g"},{"name":"Tempe Goreng","mode":"Regular","cat":"Tempe/Tahu","cal":240,"p":14,"f":16,"c":11,"note":"Estimasi warteg per 100 g"},{"name":"Tempe Bacem","mode":"Regular","cat":"Tempe/Tahu","cal":210,"p":11,"f":10,"c":20,"note":"Estimasi warteg per 100 g"},{"name":"Tempe Balado","mode":"Regular","cat":"Tempe/Tahu","cal":225,"p":12,"f":14,"c":14,"note":"Estimasi warteg per 100 g"},{"name":"Tahu Goreng","mode":"Regular","cat":"Tempe/Tahu","cal":145,"p":10,"f":10,"c":4,"note":"Estimasi warteg per 100 g"},{"name":"Tahu Balado","mode":"Regular","cat":"Tempe/Tahu","cal":160,"p":9,"f":11,"c":7,"note":"Estimasi warteg per 100 g"},{"name":"Tahu Kecap","mode":"Regular","cat":"Tempe/Tahu","cal":155,"p":8,"f":9,"c":10,"note":"Estimasi warteg per 100 g"},{"name":"Perkedel Kentang","mode":"Regular","cat":"Lauk Warteg","cal":210,"p":5,"f":12,"c":22,"note":"Estimasi warteg per 100 g"},{"name":"Bakwan Jagung","mode":"Regular","cat":"Lauk Warteg","cal":220,"p":5,"f":12,"c":25,"note":"Estimasi warteg per 100 g"},{"name":"Tumis Kangkung","mode":"Regular","cat":"Sayur","cal":95,"p":3,"f":6,"c":8,"note":"Estimasi warteg per 100 g"},{"name":"Oseng Buncis","mode":"Regular","cat":"Sayur","cal":105,"p":3,"f":6,"c":10,"note":"Estimasi warteg per 100 g"},{"name":"Capcay","mode":"Regular","cat":"Sayur","cal":85,"p":4,"f":4,"c":9,"note":"Estimasi warteg per 100 g"},{"name":"Sayur Asem","mode":"Regular","cat":"Sayur","cal":60,"p":2,"f":2,"c":10,"note":"Estimasi warteg per 100 g"},{"name":"Urap Sayur","mode":"Regular","cat":"Sayur","cal":140,"p":4,"f":9,"c":12,"note":"Estimasi warteg per 100 g"},{"name":"Tumis Tauge","mode":"Regular","cat":"Sayur","cal":80,"p":4,"f":4,"c":8,"note":"Estimasi warteg per 100 g"}];
let current=null;
const $=id=>document.getElementById(id);
function candidates(){return MENUS.filter(m=>($("mode").value==="Semua"||m.mode===$("mode").value)&&($("category").value==="Semua"||m.cat===$("category").value))}
function render(m){current=m;const g=Math.max(50,Number($("grams").value)||150),k=g/100;$("result").innerHTML=`<div><span class="tag">${m.mode}</span><span class="tag">${m.cat}</span></div><h2>${m.name}</h2><div class="grid"><div class="metric"><strong>${Math.round(m.cal*k)}</strong><small>kkal</small></div><div class="metric"><strong>${(m.p*k).toFixed(1)} g</strong><small>protein</small></div><div class="metric"><strong>${(m.f*k).toFixed(1)} g</strong><small>lemak</small></div><div class="metric"><strong>${(m.c*k).toFixed(1)} g</strong><small>karbo</small></div></div><div class="actions"><button id="use">➕ Pakai di Daily Tracker</button><button class="secondary" id="recipe">🔎 Cari Resep</button></div><p class="note">Porsi ${g} g. ${m.note}. Angka menu matang/warteg tetap perkiraan karena resep dan minyak berbeda.</p>`; $("use").onclick=()=>{localStorage.setItem("carnivore-menu-pick",JSON.stringify({...m,protein:m.p,fat:m.f,calories:m.cal,grams:g}));location.href="index.html"};$("recipe").onclick=()=>open("https://www.google.com/search?q="+encodeURIComponent(m.name+" resep"),"_blank")}
function roll(){const c=candidates();$("count").textContent=`${c.length} menu cocok dengan filter`;if(!c.length){$("result").innerHTML='<p class="muted">Tidak ada menu untuk kombinasi filter ini.</p>';return}let next=c[Math.floor(Math.random()*c.length)];if(current&&c.length>1){while(next.name===current.name)next=c[Math.floor(Math.random()*c.length)]}render(next)}
$("roll").onclick=roll;$("again").onclick=roll;$("mode").onchange=()=>{$("count").textContent=`${candidates().length} menu cocok dengan filter`};$("category").onchange=()=>{$("count").textContent=`${candidates().length} menu cocok dengan filter`};$("grams").onchange=()=>{if(current)render(current)};$("count").textContent=`${MENUS.length} menu tersedia`;
</script>
</body>
</html>
