<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate Output · Witosis 90-Day Nutrition Journey</title>
<style>
:root{--ink:#17211c;--muted:#66716a;--paper:#f5f6f2;--panel:#fff;--line:#dfe5de;--green:#2f9348;--yellow:#f5be22;--future:#e3e5e4;--not:#7b7e7d;--navy:#172634}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(1500px,calc(100% - 24px));margin:auto;padding:14px 0 30px}.report{background:#fff;border:1px solid var(--line);overflow:hidden}.head{background:#11191f;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.head h2{margin:0 0 4px;font-size:clamp(1.3rem,3vw,2rem)}.sub{color:#e7e9e8}.sub strong{color:#ffd23e}.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.legend span{display:flex;gap:6px;align-items:center}.sw{width:22px;height:22px;border-radius:3px}.done{background:linear-gradient(#37a24c,#23863b)}.today{background:linear-gradient(#ffc935,#edae0f)}.upcoming{background:linear-gradient(#f1f2f2,#d8dad9)}.notstarted{background:linear-gradient(#8d8f8f,#747676)}
.scroll{overflow-x:auto}.gantt{min-width:1220px;display:grid;grid-template-columns:185px 100px repeat(90,minmax(28px,1fr));border-top:2px solid #cfd6d2}.cell{min-height:62px;border-right:1px solid rgba(255,255,255,.75);border-bottom:1px solid #dfe3df;display:flex;align-items:center;justify-content:center;text-align:center}.h{background:var(--navy);color:#fff;font-weight:800;min-height:70px}.phase{align-items:flex-start;flex-direction:column;text-align:left;padding:10px;background:#fff}.phase strong{color:#147b2b}.phase small{margin-top:5px;color:#4d5851}.range{background:#fff;font-weight:800}.day{background:var(--navy);color:#fff;font-weight:800}.bar.done{color:#fff;font-size:1.25rem;font-weight:900}.bar.today{color:#222}.bar.upcoming{background:linear-gradient(135deg,#f2f3f3,#d9dbda)}.bar.notstarted{background:linear-gradient(135deg,#8d8f8f,#747676)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}.stat span{display:block;color:var(--muted);font-size:.75rem;font-weight:800}.stat strong{display:block;font-size:1.55rem;margin:3px 0}.notes{margin:0 16px 16px;border:1px solid var(--line);border-radius:14px;padding:14px 18px}.notes h3{margin:0 0 8px}.notes li{margin:4px 0}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
@media(max-width:800px){main{width:100%;padding:0}.head{padding:14px 12px}.stats{grid-template-columns:1fr 1fr;padding:10px}.notes{margin:0 10px 10px}.gantt{min-width:3000px}.cell{min-height:56px}}@media(max-width:480px){.stats{grid-template-columns:1fr}}
</style></head>
<body><main><section id="report" class="report"><div class="empty">Memuat data tracker…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const STORAGE_KEY='carnivore-daily-v1';
const SUPABASE_URL='https://nuxmvlwjpxuxlxwgkjvw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_9t9yUUeuAzFmyLU5O7shdA_B3RTlylp';
const report=document.getElementById('report');
const pad=n=>String(n).padStart(2,'0');
function localToday(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateObj(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12,0,0,0)}
function calcDay(start,end=localToday()){return Math.floor((dateObj(end)-dateObj(start))/86400000)+1}
function fmtDate(s){return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(dateObj(s))}
function localApp(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}}
async function cloudApp(){const code=localStorage.getItem('carnivore-sync-code')||'';if(!code||typeof supabase==='undefined')return null;try{const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data,error}=await c.from('tracker_state').select('data').eq('sync_code',code).maybeSingle();if(error)throw error;return data?.data||null}catch(e){console.warn(e);return null}}
function phaseFor(day){if(day<=7)return ['ADAPTASI CARNIVORE','Adaptasi tubuh ke pola makan carnivore'];if(day<=14)return ['STABILISASI CARNIVORE','Energi mulai stabil, craving berkurang'];if(day<=21)return ['PENYESUAIAN CARNIVORE','Adaptasi makin kuat, fokus ke konsistensi'];if(day<=30)return ['KONSISTENSI CARNIVORE','Selesaikan fase carnivore ketat dan evaluasi 30 hari'];if(day<=60)return ['TRANSISI LOW CARB','Carnivore ketat selesai; fokus protein tinggi, sayur, dan karbo terkontrol'];return ['LOW CARB BERKELANJUTAN','Pola makan fleksibel dan sustainable dengan protein sebagai fondasi']}
function notesFor(day,loss){const a=[];if(day<=7)a.push('Fase adaptasi carnivore: fokus hidrasi, elektrolit, protein, dan respons pencernaan.');else if(day<=14)a.push('Fase stabilisasi: pantau energi, rasa lapar, dan kecukupan protein.');else if(day<=21)a.push('Fokus ke konsistensi dan kualitas makanan, bukan perubahan berat harian.');else if(day<=30)a.push('Fase penutup carnivore ketat: evaluasi hasil 30 hari dan siapkan transisi.');else if(day<=60)a.push('Fase low carb: protein tetap jadi fondasi, sayur boleh masuk, nasi/tepung/gula tetap dibatasi.');else a.push('Fase sustainable low carb: cari pola yang bisa dipertahankan tanpa harus kembali ke carnivore ketat.');if(day>30)a.push('Mulai Day 31, tracker menganggap pola diet sebagai low carb, bukan carnivore ketat.');if(Number.isFinite(loss))a.push(loss>0?`Berat turun ${loss.toFixed(1)} kg dari awal.`:loss<0?`Berat naik ${Math.abs(loss).toFixed(1)} kg dari awal; lihat tren beberapa hari.`:'Berat saat ini sama dengan berat awal.');a.push(day>=90?'Day 90 tercapai — evaluasi pola yang paling sustainable.':`Fokus berikutnya: lanjut konsisten menuju Day ${Math.min(90,day+1)}.`);return a}
function makeGantt(day){const phases=[['ADAPTASI CARNIVORE','Adaptasi tubuh ke pola makan carnivore',1,7],['STABILISASI CARNIVORE','Energi mulai stabil, craving berkurang',8,14],['PENYESUAIAN CARNIVORE','Adaptasi makin kuat, fokus ke konsistensi',15,21],['KONSISTENSI CARNIVORE','Selesaikan fase carnivore ketat',22,30],['TRANSISI LOW CARB','Protein tinggi, sayur mulai masuk, karbo tetap terkontrol',31,60],['LOW CARB BERKELANJUTAN','Pola fleksibel dan sustainable untuk jangka menengah',61,90]];let h='<div class="cell h">PHASE</div><div class="cell h">DAY<br>RANGE</div>'+Array.from({length:90},(_,i)=>`<div class="cell day">${i+1}</div>`).join('');for(const [name,desc,from,to] of phases){h+=`<div class="cell phase"><strong>${name}</strong><small>${desc}</small></div><div class="cell range">${from} – ${to}</div>`;for(let d=1;d<=90;d++){let cls='notstarted',mark='';if(d>=from&&d<=to){if(d<day){cls='done';mark='✓'}else if(d===day){cls='today'}else{cls='upcoming'}}h+=`<div class="cell bar ${cls}">${mark}</div>`}}return h}
function render(app){const logs=Array.isArray(app?.logs)?app.logs:[];if(!logs.length){report.innerHTML='<div class="empty"><strong>Belum ada log.</strong><br>Tambahkan data di tracker dulu.</div>';return}const dates=[...new Set(logs.map(x=>x.date).filter(Boolean))].sort();const startDate=dates[0];const rawDay=calcDay(startDate);const day=Math.max(1,Math.min(90,rawDay));const weights=logs.filter(x=>Number(x.weight)>0).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));const latest=weights.at(-1);const s=Number(app?.settings?.startWeight);const startWeight=Number.isFinite(s)&&s>0?s:Number(weights[0]?.weight);const currentWeight=Number(latest?.weight);const loss=Number.isFinite(startWeight)&&Number.isFinite(currentWeight)?startWeight-currentWeight:NaN;const [phase]=phaseFor(day);const progress=(day/90*100).toFixed(1);const notes=notesFor(day,loss);report.innerHTML=`<div class="head"><div><h2>90 DAY NUTRITION JOURNEY – CARNIVORE → LOW CARB</h2><div class="sub">Start: <b>${fmtDate(startDate)}</b> &nbsp;|&nbsp; <strong>Current: Day ${day}</strong> &nbsp;|&nbsp; Target: Day 90</div></div><div class="legend"><span><i class="sw done"></i>Completed</span><span><i class="sw today"></i>Today</span><span><i class="sw upcoming"></i>Upcoming</span><span><i class="sw notstarted"></i>Not Started</span></div></div><div class="scroll"><div class="gantt">${makeGantt(day)}</div></div><div class="stats"><div class="stat"><span>PROGRESS OVERALL</span><strong>${progress}%</strong><small>${day} / 90 Hari</small></div><div class="stat"><span>HARI INI</span><strong>DAY ${day}</strong><small>${phase}</small></div><div class="stat"><span>BERAT BADAN</span><strong>${Number.isFinite(currentWeight)?currentWeight.toFixed(1)+' kg':'—'}</strong><small>${Number.isFinite(loss)?(loss>=0?'↓ ':'↑ ')+Math.abs(loss).toFixed(1)+' kg dari awal':'Belum cukup data'}</small></div><div class="stat"><span>TARGET</span><strong>DAY 90</strong><small>${Math.max(0,90-day)} hari lagi</small></div></div><div class="notes"><h3>Catatan Day ${day}</h3><ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`}
async function refresh(){const local=localApp();if(local)render(local);const remote=await cloudApp();if(remote){localStorage.setItem(STORAGE_KEY,JSON.stringify(remote));render(remote)}}
refresh();window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
